# Render Blueprint - optional infra-as-code alternative to configuring the
# Web Service by hand in the Render dashboard (see docs/DEPLOY_FREE_TIER.md
# for the equivalent click-through steps and full explanation of each var).
# Import: Render dashboard -> New -> Blueprint -> select this repo.
#
# Neon Postgres is not provisioned here - Render Blueprints don't manage
# external databases. Create the Neon project separately and paste its
# connection string into FINOPS_DATABASE_URL below (or as a dashboard
# secret) after the blueprint is applied.
services:
  - type: web
    name: finops-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: FINOPS_ENVIRONMENT
        value: production
      - key: FINOPS_DATABASE_URL
        sync: false # paste the Neon connection string here
      - key: FINOPS_AUTO_CREATE_TABLES
        value: "false"
      - key: FINOPS_JWT_SECRET_KEY
        generateValue: true # Render generates a random 32+ char value
      - key: FINOPS_PRICING_PROVIDER
        value: gcp
      - key: FINOPS_CLOUD_PROVIDER
        value: gcp
      - key: FINOPS_CORS_ALLOW_ORIGINS
        sync: false # e.g. ["https://your-app.vercel.app"]
      - key: FINOPS_GCP_SERVICE_ACCOUNT_JSON
        sync: false # path to a mounted Render Secret File, e.g. /etc/secrets/gcp-service-account.json
      # -- LLM-assisted explanations (Groq) - optional, no FINOPS_ prefix --
      # Both unset by default: /api/v1/explanations/* and report exports with
      # include_ai_explanations=true fall back to deterministic template text
      # automatically when either is missing, so the app boots and prices
      # estimates normally either way. Paste real values as Render dashboard
      # secrets (Environment tab) rather than committing them here.
      - key: GROQ_API_KEY
        sync: false # paste your Groq API key here (https://console.groq.com/keys)
      - key: GROQ_MODEL
        sync: false # e.g. llama-3.3-70b-versatile
