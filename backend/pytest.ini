[pytest]
testpaths = tests
pythonpath = .
addopts = -p no:cacheprovider
filterwarnings =
    # The default dev/test JWT secret ("insecure-dev-secret-change-me", 29
    # bytes) is intentionally short and human-readable - it's a sentinel the
    # production startup guard (app/core/secrets.py) detects and refuses to
    # boot with, so it never reaches a real deployment. Expected in tests.
    ignore:.*HMAC key is.*below the minimum recommended length.*:jwt.warnings.InsecureKeyLengthWarning
